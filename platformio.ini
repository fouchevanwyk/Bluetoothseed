[env:seeed_xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
; Serial on this core is USB CDC provided by the bundled TinyUSB library;
; PlatformIO doesn't link it automatically, so pull it in explicitly.
lib_deps =
    Adafruit TinyUSB Library
